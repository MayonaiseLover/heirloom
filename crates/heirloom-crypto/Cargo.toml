[package]
name = "heirloom-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "At-rest encryption for Heirloom (age-based seal/unseal)."
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "rand_core"] }
argon2 = "=0.5.3"
rand = "=0.8.5"
sha2.workspace = true
hex.workspace = true
# Force pin on a transitive dep that needs newer rustc on its latest patch
base64ct = "=1.6.0"

[dev-dependencies]
tempfile = "3"
