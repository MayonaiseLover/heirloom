[package]
name = "heirloom-team"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hostable team-memory server for Heirloom."
repository.workspace = true

[[bin]]
name = "heirloom-team-server"
path = "src/main.rs"

[lib]
name = "heirloom_team"
path = "src/lib.rs"

[dependencies]
heirloom-core.workspace = true
heirloom-crypto = { path = "../heirloom-crypto", version = "0.1.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
urlencoding = "2"
toml.workspace = true

[dev-dependencies]
tempfile = "3"
