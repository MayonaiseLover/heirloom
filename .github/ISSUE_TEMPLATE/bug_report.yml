name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Step by step. The shorter and more deterministic, the better.
      placeholder: |
        1. heirloom init
        2. heirloom ingest fs --path ./fixtures
        3. heirloom search "foo"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Heirloom version
      description: Output of `heirloom --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `HEIRLOOM_LOG=debug` and paste anything interesting. Redact freely.
      render: text
