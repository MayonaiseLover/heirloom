name: Feature request
description: Suggest something Heirloom doesn't do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: Describe the pain. What do you want to do that Heirloom can't?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal behavior look like? CLI flags, MCP tools, ingester options — get concrete.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
