name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.83.0"

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p heirloom-cli

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p heirloom-cli

      - name: Build heirloom-team-server (native only)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p heirloom-team
        continue-on-error: true

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          NAME="heirloom-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$NAME"
          cp "target/${{ matrix.target }}/release/heirloom" "$NAME/"
          if [ -f "target/${{ matrix.target }}/release/heirloom-team-server" ]; then
            cp "target/${{ matrix.target }}/release/heirloom-team-server" "$NAME/"
          fi
          cp README.md LICENSE CHANGELOG.md "$NAME/"
          tar czf "dist/$NAME.tar.gz" "$NAME"
        shell: bash

      - name: Package (zip)
        if: matrix.archive == 'zip' && startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = "heirloom-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/heirloom.exe" "$name/"
          if (Test-Path "target/${{ matrix.target }}/release/heirloom-team-server.exe") {
            Copy-Item "target/${{ matrix.target }}/release/heirloom-team-server.exe" "$name/"
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md "$name/"
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
        shell: pwsh

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: heirloom-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
